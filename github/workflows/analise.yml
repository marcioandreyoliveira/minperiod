name: Coleta e Análise Diária

on:
  schedule:
    # Roda todo dia às 09:00 UTC (06:00 BRT)
    - cron: '0 9 * * *'
  workflow_dispatch:  # permite rodar manualmente

# Permissão de escrita para o git push
permissions:
  contents: write

env:
  TICKERS: "CMIG4 TAEE3 PETR4 VALE3 ITUB4 BBDC4 ABEV3 WEGE3 B3SA3 SUZB3"
  INTERVALO: "5"      # minutos
  PERIODO: "60"       # dias
  FAIXA: "60"         # minutos (faixa de análise)

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install yfinance pandas

      - name: Baixar dados de todos os tickers
        run: |
          for ticker in $TICKERS; do
            echo "=== Baixando $ticker ==="
            python getprices.py $ticker $INTERVALO $PERIODO || echo "Falha ao baixar $ticker"
          done

      - name: Analisar cada ticker
        run: |
          for ticker in $TICKERS; do
            echo "=== Analisando $ticker ==="
            python analise_minimas.py $ticker . $FAIXA || echo "Falha ao analisar $ticker"
          done

      - name: Commit dos CSVs e JSONs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv resultado_analise_*.json
          git diff --staged --quiet || git commit -m "Atualização $(date -u +%Y-%m-%d_%H%M)"
          git push
