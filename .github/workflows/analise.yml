name: Coleta e Análise Diária

on:
  schedule:
    # Roda todo dia às 09:00 UTC (06:00 BRT)
    - cron: '0 9 * * *'
  workflow_dispatch:  # permite rodar manualmente

# Permissão de escrita para o git push
permissions:
  contents: write

env:
  TICKERS: "BRSR6 BBAS3 ITUB4 ITSA4 CMIG4 TAEE3 CPFE3 ISAE4 CXSE3 BBSE3 TIMS3 VIVT3 BRAP3"
  INTERVALO: "1"      # minutos
  PERIODO: "7"       # dias
  FAIXA: "60"         # minutos (faixa de análise)

jobs:
  pipeline:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install yfinance pandas

      - name: Baixar dados para data/
        run: |
          mkdir -p data
          cd data
          for ticker in $TICKERS; do
            echo "=== Baixando $ticker ==="
            python ../getprices.py $ticker $INTERVALO $PERIODO || echo "Falha ao baixar $ticker"
          done

      - name: Analisar dados em results/
        run: |
          mkdir -p results
          cd results
          for ticker in $TICKERS; do
            echo "=== Analisando $ticker ==="
            python ../analise_minimas.py $ticker ../data $FAIXA || echo "Falha ao analisar $ticker"
          done

      - name: Commit dos CSVs e JSONs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ results/
          git diff --staged --quiet || git commit -m "Atualização $(date -u +%Y-%m-%d_%H%M)"
          git push
